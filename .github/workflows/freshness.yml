name: freshness

# SR-0036.

# throughline is declared as a floor, not locked, so CI resolves whatever PyPI
# happens to publish. A green check is therefore only true on the day it ran: a
# core release can turn this repo red without a commit here, and nothing would say
# so until a contributor next opened a pull request — who then meets a failure
# that has nothing to do with their change. That is not hypothetical here; it is
# what happened on 2026-08-09, when PR #6 sat green for two days while throughline
# 1.13 shipped a rule this graph did not satisfy.
#
# Composition is the exposed case: a change lands here but is judged by core's
# validator, so a core release can change this repo's answers without changing a
# line of it. Two ends are worth testing and they fail for opposite reasons: the
# ceiling catches a core that has moved ahead of us, the floor catches a minimum
# we have declared but no longer actually support.

on:
  schedule:
    # 03:17 UTC daily — outside UK working hours under both GMT and BST. Offset
    # from the hour because scheduled jobs queue heavily on the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceiling:
    name: latest published core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install, resolving dependencies fresh
        run: pip install -e ".[dev]"

      - name: Record what was resolved
        run: pip list

      - name: Unit tests
        run: pytest -q

      - name: Self-host gate (this repo's own composed graph)
        run: tl-compose -C idd check --strict

      - name: Docs freshness gate (published docs must match the graph)
        run: tl-compose -C idd docs --check

  floor:
    name: declared minimum core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11" # the lowest interpreter we claim to support

      - name: Install at the declared floor
        # Read the floors out of pyproject rather than restating them here, so
        # this cannot drift from the versions the package actually promises.
        run: |
          pins=$(python -c "
          import tomllib
          deps = tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']
          print(' '.join(d.replace('>=','==') for d in deps))
          ")
          echo "installing floor: $pins"
          pip install $pins
          pip install -e . --no-deps
          pip install pytest

      - name: Record what was resolved
        run: pip list

      - name: Unit tests
        run: pytest -q

      - name: Self-host gate (this repo's own composed graph)
        run: tl-compose -C idd check --strict
