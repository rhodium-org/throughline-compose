name: dco

# SR-0030 — every commit that lands on the default branch carries a Developer
# Certificate of Origin sign-off. The gate follows the commit, not the route it
# arrived by: on a pull request it blocks the merge (once set as a required status
# check in branch protection — that half is repository settings, not this file);
# on a direct push it fails the build, which is the strongest gate that route
# allows.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sign-off:
    name: sign-off (DCO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The check walks a commit range, so the shallow default is not enough.
          fetch-depth: 0

      - name: Every commit carries a Developer Certificate of Origin sign-off
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          empty=0000000000000000000000000000000000000000
          if [ -z "${BASE}" ] || [ "${BASE}" = "${empty}" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # A new branch, or a force-push that orphaned the old tip. There is no
            # honest range to walk, so check the tip alone rather than silently
            # passing or walking the whole of history.
            echo "no usable base commit — checking ${HEAD} alone"
            range="${HEAD}~1..${HEAD}"
            git cat-file -e "${HEAD}~1^{commit}" 2>/dev/null || range="${HEAD}"
          else
            range="${BASE}..${HEAD}"
          fi

          # --no-merges: a merge commit GitHub or a contributor made to bring the
          # base branch forward carries no authored work, and demanding a sign-off
          # on one fails contributions that are themselves entirely signed.
          commits="$(git rev-list --no-merges "${range}")"
          if [ -z "${commits}" ]; then
            echo "no commits to check in ${range}"
            exit 0
          fi

          failed=0
          for sha in ${commits}; do
            author="$(git show -s --format='%an <%ae>' "${sha}")"
            committer="$(git show -s --format='%cn <%ce>' "${sha}")"
            subject="$(git show -s --format='%s' "${sha}")"

            # Either endpoint satisfies the trailer. Matching the author strictly
            # would reject cherry-picks, rebases and co-authored work, where the
            # person offering the contribution is the committer.
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "${sha}" \
                 | sed 's/[[:space:]]*$//' \
                 | grep -qxF -e "${author}" -e "${committer}"; then
              echo "ok    ${sha:0:8}  ${subject}"
              continue
            fi

            failed=1
            echo "::error::${sha:0:8} ${subject} — no Signed-off-by matching ${author}"
            echo "FAIL  ${sha:0:8}  ${subject}"
            echo "        author    ${author}"
            echo "        committer ${committer}"
          done

          if [ "${failed}" -eq 0 ]; then
            echo "all commits signed off"
            exit 0
          fi

          # The measurable friction in a DCO gate is a contributor who forgot -s and
          # must now rewrite history. The check that rejects the work is the one
          # place that fix is certain to be read (SR-0030), so it is printed here
          # rather than left in CONTRIBUTING.md.
          cat <<'EOF'

          ------------------------------------------------------------------
          How to fix this

          This project requires a Developer Certificate of Origin sign-off on
          every commit — see https://developercertificate.org and
          CONTRIBUTING.md. Signing off asserts you have the right to submit the
          work under the project's licence. It is one flag:

              git commit -s -m "Your message"

          To sign off what you have already committed:

              # the most recent commit only
              git commit --amend -s --no-edit && git push --force-with-lease

              # every commit on your branch
              git rebase --signoff origin/main && git push --force-with-lease

          Note that GitHub's web editor does not add the trailer, so a change
          made in the browser needs amending locally.
          ------------------------------------------------------------------
          EOF
          exit 1
