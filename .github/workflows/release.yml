name: release

# Publishes throughline-compose to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored as a secret. Before
# the first release, register this repository + workflow as a trusted publisher for
# the `throughline-compose` project on PyPI
# (https://pypi.org/manage/account/publishing/) and create a GitHub Environment named
# `pypi`. Until then this workflow is dormant (it only runs on a published Release,
# and there is nothing to publish before then).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The shipped suite, run from the shipped artifact, BEFORE anything is uploaded
  # (SR-0028). A check that runs after the upload names a defect the reader can no
  # longer avoid, so publication waits on this rather than reporting beside it.
  sdist-suite:
    uses: ./.github/workflows/sdist-suite.yml

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build, sdist-suite]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/throughline-compose
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
