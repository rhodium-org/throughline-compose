uid: UR-0012
type: user_requirement
status: ratified
title: What is expected of participants, and where a breach is taken
text: The behaviour expected of everyone taking part shall be stated in the repository,
  with a private route for reporting a breach and a named person answerable for acting
  on one. An expectation nobody has written down cannot be relied on by the person
  it exists to protect.
