uid: INT-0001
type: intent
status: ratified
title: One project IDD composed from many reusable sources
text: A project's requirements graph is assembled, not re-authored. A team pulls
  in one or more existing sources — a house style guide, a platform standard, a regulatory
  baseline, most often themselves throughlines — alongside the requirements they
  write themselves, and works against the combined graph as if it were one. A source
  need not itself be a throughline — what matters is that it can be presented in
  throughline shape and kept separately versioned. Reuse never copies or renumbers
  the borrowed items — each keeps the permanent identity it was born with in its
  own source, so the combined graph is a view over independent, separately versioned
  sources rather than a fork of them.
