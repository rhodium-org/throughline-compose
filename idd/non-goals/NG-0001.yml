uid: NG-0001
type: non_goal
status: ratified
title: Composition is not built into the tl core
text: Composition — source declaration, pinning, fetching, and merging — is deliberately
  not added to the `throughline` core or its `tl` command. The core stays a single-purpose,
  offline-by-default, self-contained tool over one graph; the network, lockfile,
  untrusted-source, and union concerns live entirely in throughline-compose, which
  consumes the core as a library. The only concession the core makes to composition
  is recognising the namespace-qualified reference syntax so it can fail fast on
  one (SR-0005) — it gains no ability to resolve, fetch, or merge. This is recorded
  negative space — it exists to keep later design honest, so that a proposal to "just
  add sources to tl" is measured against a decision already taken rather than reopened
  by default.
normative: false
