uid: SR-0052
type: system_requirement
status: ratified
title: The core floor rises to the release that records what a signature signed and
  leaves room for this package
text: 'The declared floor on throughline rises to 3.11.1. It is the first release
  that both records the content a stamp signed and keeps room in its parser for the
  names this package adds: below 3.10.0 this package''s ratify writes a record with
  no content that the core''s own check then calls an error, and 3.11.0 refuses to
  start under this package because it registers agentinfo and --local first. Nothing
  this package calls has moved.'
normative: true
