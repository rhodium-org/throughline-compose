uid: SR-0052
type: system_requirement
status: proposed
title: The core floor rises to the release that records what a ratification signed
text: 'The declared floor on throughline rises to 3.10.0, the release in which every
  stamp the core writes also records the content it was taken over. This package
  does not write a stamp itself: tl-compose ratify hands the act to the core''s own
  ratify, so an install pinned to an older core would write a record with no content
  through this command, and the core''s own check then reports that record as an
  error. The floor is what stops the pairing. Nothing this package calls has moved.'
normative: true
