uid: SR-0022
type: system_requirement
status: implemented
title: Composed check reports the same graph summary as core, split local vs borrowed
text: After validating the union, tl-compose check shall print the same human-readable
  graph summary that core tl check prints — items by type, status breakdown, link
  breakdown and grounding coverage — computed over the composed union, so a composer
  gets the same picture of what was validated whether or not the project has sources.
  The summary shall additionally distinguish the consumer's own items from items
  borrowed through a source, reporting both the union totals and the local subset,
  so the composer can read their own graph at a glance without the borrowed clauses
  drowning it. The summary is suppressed by the existing quiet flag exactly as in
  core, and the machine-readable json output is unaffected.
normative: true
