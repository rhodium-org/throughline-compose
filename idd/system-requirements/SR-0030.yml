  invalidated_reason: Withdrawn, not superseded. The gate would have blocked every
    browser-based contribution — a web edit, an accepted review suggestion, a revert
    — because GitHub composes those commits with no Signed-off-by trailer and no
    check can supply one. UR-0008 now rests on section 5 of the licence, which needs
    nothing from the contributor per commit.
