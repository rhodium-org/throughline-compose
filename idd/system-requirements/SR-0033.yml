uid: SR-0033
type: system_requirement
status: implemented
title: SECURITY.md names a private reporting route and what it covers
text: A SECURITY.md at the repository root shall direct a reporter to GitHub's private
  vulnerability reporting rather than a public issue, state which versions are supported,
  and set the expectation of acknowledgement, of a window to fix before disclosure,
  and of credit. It shall say what is worth reporting for a tool of this kind — including
  any way a composed source can be made to resolve to content other than its pinned
  ref, which is this project's own worst failure and not an obvious one from outside.
normative: true
