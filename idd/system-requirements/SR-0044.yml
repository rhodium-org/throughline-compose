uid: SR-0044
type: system_requirement
status: proposed
title: Declared sources are resolved side by side
text: 'The sources a consumer declares are resolved at the same time, not one after
  another: each look-up of a pinned ref on its origin (SR-0043), and each fetch,
  runs beside the others. Two declared sources that share a URL and ref share a cache
  directory, so only the first of them runs alongside the rest and the others resolve
  after it, from the warm cache. The union is assembled in declared order whatever
  order the resolutions finish in, and a source that fails is reported as it was
  before, the first in declared order. Re-exported transitive sources resolve after
  the sources that carry them, as now. Cache-only mode is unchanged.'
rationale: 'Measured on a consumer of seven sources with a warm cache, the seven
  sequential origin look-ups cost four of the fourteen seconds every command took.
  Run side by side they cost the slowest one. Nothing is cached and nothing is skipped:
  the same look-ups, the same answers, the same refetch on a moved ref. Rejected:
  a lock file recording each tag''s commit, because it adds state whose invalidation
  has to be right and changes what a moved tag means; the operator chose to keep
  SR-0043''s contract as it stands. The shared-cache rule exists because two clones
  into one directory at once would corrupt it. Verified by test: three sources made
  slow resolve in about the time of one, bind in declared order, a shared URL and
  ref is never fetched twice at once, and a failing source gives the same error.'
normative: true
