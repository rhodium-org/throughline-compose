uid: BN-0004
type: business_need
status: ratified
title: Contributable
text: As an open-source project, throughline-compose should let an outside contributor
  understand how to contribute, how to report a vulnerability privately, and what
  conduct is expected, and should have each contribution arrive carrying an explicit,
  recorded grant of the rights under which it is offered — so that a contribution
  can be accepted without a later, unanswerable question about the terms on which
  it was given.
