[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline-compose"
version = "0.22.0"
description = "Names for what throughline provides. Composition moved into throughline 3.11; this package re-exports the Tool's names under the paths consumers imported before, and installs no command of its own."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Henry J Grech-Cini", email = "henry.grechcini@gmail.com" }]
keywords = [
  "requirements",
  "requirements-management",
  "traceability",
  "composition",
  "git-native",
  "idd",
  "intent-driven-development",
  "throughline",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["throughline>=3.11.1"]  # 3.11.1 is the first release that both records what a stamp signed (tl:SR-0215) and leaves room in its parser for this package's own additions (tl:SR-0231): 3.10.0 would write a record with no content through this package's `ratify`, and 3.11.0 refuses to start under it at all (SR-0052). Nothing this package calls moved. Previously: is_external / is_namespace_qualified public since 0.4.0 (SR-0004); tl:count badge needs 0.5.0 (SR-0109); tl:graph collapse-external needs 0.6.0 (SR-0118); format_version 3 + required [status.roles] needs 1.2.0; tl trace tree-rendering fix needs 1.2.1; read_project tolerant read-only multi-major source loader needs 1.2.2 (SR-0017/UR-0006); force_utf8_io public symbol needs 1.3.0 (SR-0003); ratify's prebuilt-index seam, forwarded to composed consumers, needs 1.4.0 (SR-0003); migrate's ratification-record repair needs 1.5.0, or the forwarded `tl-compose migrate` reports "nothing to migrate" over unbound records (SR-0003); the repair's grounding-index seam, which `_compose_migrate` supplies the union through, needs 1.6.0 (SR-0004); the authored-identity a borrowed item keeps through re-labelling, which the union sets so a source's ratification stamp is not read as stale, needs 1.7.0 (SR-0024); the ratifier identity core now offers by default and the optional --by-id it records, which `_compose_ratify` must offer identically or the same command behaves differently with and without sources, needs 1.8.0 (SR-0003); the authored normative-attribute set a borrowed item keeps, which the union sets from the source's own schema so a consumer is not forced to mirror a source's normative flags in order to compose it, needs 1.9.0 (SR-0024); throughline.version.distribution_version, which marks a working-tree install instead of naming the release it has departed from, and which this CLI reports both packages through rather than keeping a second copy of the rule, needs 1.10.0 (SR-0027); the suspicion-reachability rule narrowed to the statuses an item can actually hold, and its occupancy counted from locally-authored items only, needs 1.13.2 — both are composition-specific corrections: 1.13.0 judged every declared status, so the vocabulary a consumer declares solely to accept a borrowed item was reported against the consumer as a suspicion gap it cannot act on (SR-0177, SR-0178); the document-directive registry this layer registers tl:sourced through — register_directive, the public render_item/matching helpers, and the block-heading identity seam — needs 2.0.0, which is also where core stopped providing tl:sourced itself, so an older core paired with this release would both fail to register the directive and still carry the stub it replaces (SR-0039, throughline SR-0186/SR-0187/NG-0007); the induced-subgraph walker and the one renderer both tools emit an item's neighbourhood through — Index.subgraph with its `expand` boundary seam, cmd_subgraph/render_subgraph/_subgraph_json, and context_item_section — needs 2.2.0, and it is the renderer that fixes the floor rather than the walker: composing the section here while rendering it there is what keeps `tl` and `tl-compose` from describing one section to an agent in two wordings (SR-0041, SR-0042, throughline SR-0189/SR-0190); the correction mode ratify grew — `replacing`, which lifts SR-0148's refusal only for a record version control has never seen — needs 3.2.0, because `_compose_ratify` must forward it or `tl-compose ratify --replacing` refuses in a composed project what bare `tl ratify --replacing` performs (SR-0003, throughline SR-0196); ratify's positional became the list `uids` in 3.3.0 (throughline SR-0199), which `_compose_ratify` reads by name and forwards item by item, so it needs 3.3.0 (SR-0046); the birth function `tl new` creates items through — birth_item, which `_compose_new` calls so an item grounded into a source is born as bare tl bears it, proposed for a machine origin with the schema's defaults and the type's normative flag — needs 3.5.1 (SR-0047, throughline SR-0205); the baseline function and its note, read_baseline and baseline_note, which `_compose_check` calls so a composed check runs transition legality and tombstone permanence as bare tl check does, and the link operations with their GroundingView seam, add_link, retype_link and remove_link, which `_compose_link` and `_compose_unlink` perform over the union, need 3.7.0 (SR-0048, SR-0049, throughline SR-0209..SR-0212)

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/rhodium-org/throughline-compose"
Repository = "https://github.com/rhodium-org/throughline-compose"
Issues = "https://github.com/rhodium-org/throughline-compose/issues"

# No scripts: tl-compose and throughline-compose are names throughline installs, and
# they run the Tool (SR-0053).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
